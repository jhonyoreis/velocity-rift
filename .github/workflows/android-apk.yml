name: Android APK (Velocity Rift)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: velocity-rift-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install game dependencies
        run: npm install --no-audit --no-fund
      - name: Check gameplay
        run: npm test
      - name: Build bundled web game
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Copy game into Android
        run: npx cap sync android
      - name: Configure landscape orientation
        run: node scripts/configure-android.mjs
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: velocity-rift-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
