 <path d="M-22 24L28 5L44 46L9 76L-33 62Z" fill="#cbfff4" opacity=".84"/>
 <path d="M-35 89L22 84L31 106L-21 120Z" fill="#204d76"/>
 <!-- Front leg -->
 <path d="M19 97L96 119L149 88" fill="none" stroke="#2386a7" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="M139 80l50-13 25 27-9 24-65 8-26-25z" fill="url(#shoe)" stroke="#47335c" stroke-width="6" stroke-linejoin="round"/>
 <path d="M167 122l41-10" stroke="#fff3b0" stroke-width="6" stroke-linecap="round"/>
 <!-- Head and forward muzzle -->
 <path d="M-42-86C-20-127 42-128 65-92L78-43L56-8L12 2L-34-25Z" fill="#e8fffb" stroke="#19546d" stroke-width="8"/>
 <path d="M-39-94C-13-136 50-132 72-100L91-54L61-56L39-77L-7-69Z" fill="url(#armor)" stroke="#1b6079" stroke-width="7"/>
