<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 760" role="img" aria-labelledby="title desc">
<title id="title">Flux atravessa uma cidade de neon em direção a uma fenda dimensional</title>
<desc id="desc">Ilustração estilizada da aventura Velocity Rift, com o personagem correndo em primeiro plano.</desc>
<defs>
  <radialGradient id="haze"><stop stop-color="#7652c6" stop-opacity=".43"/><stop offset=".48" stop-color="#3c398b" stop-opacity=".24"/><stop offset="1" stop-color="#06152c" stop-opacity="0"/></radialGradient>
  <linearGradient id="city" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#325078"/><stop offset="1" stop-color="#0a1834"/></linearGradient>
  <linearGradient id="portal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#85ffee"/><stop offset=".5" stop-color="#b39bfa"/><stop offset="1" stop-color="#51cedc"/></linearGradient>
  <linearGradient id="interior" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#21376d"/><stop offset=".45" stop-color="#41216e"/><stop offset="1" stop-color="#100f38"/></linearGradient>
  <linearGradient id="armor" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#6af9e2"/><stop offset=".55" stop-color="#2797b3"/><stop offset="1" stop-color="#17476f"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff6aa"/><stop offset=".5" stop-color="#ffbd6a"/><stop offset="1" stop-color="#d66a57"/></linearGradient>
  <linearGradient id="shoe" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffeaa1"/><stop offset=".55" stop-color="#f0a252"/><stop offset="1" stop-color="#bd4b4d"/></linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="25"/></filter>
  <clipPath id="gate"><ellipse cx="560" cy="324" rx="133" ry="226"/></clipPath>
</defs>
<ellipse cx="545" cy="335" rx="340" ry="350" fill="url(#haze)"/>
<path d="M132 666C306 565 510 600 807 665L850 760H25Z" fill="#081730" opacity=".72"/>
<!-- Distant city skyline -->
<g fill="url(#city)" opacity=".66">
 <path d="M126 592V357H169V327H184V377H206V499H232V308H270V260H282V308H314V546H335V411H376V389H394V579H439V480H476V436H497V586H515V549H565V578H619V438H649V406H667V560H696V365H737V306H749V365H766V552H820V609Z"/>
</g>
<g fill="#8cf9ec" opacity=".31">
 <path d="M245 341h5v18h-5zm16 0h5v18h-5zm-16 34h5v18h-5zm16 0h5v18h-5zm-16 34h5v18h-5zm16 0h5v18h-5zm-16 34h5v18h-5zm16 0h5v18h-5zM712 394h7v14h-7zm20 0h7v14h-7zm-20 31h7v14h-7zm20 31h7v14h-7zm-20 31h7v14h-7zM349 449h7v11h-7zm16 0h7v11h-7zm-16 25h7v11h-7z"/>
</g>
<g opacity=".8" fill="#d6a7ff"><circle cx="232" cy="190" r="3"/><circle cx="356" cy="91" r="2"/><circle cx="743" cy="166" r="3"/><circle cx="733" cy="85" r="2"/><circle cx="287" cy="244" r="1.7"/></g>
<!-- Rift aperture -->
<ellipse cx="560" cy="324" rx="146" ry="238" fill="#83fcef" opacity=".28" filter="url(#soft)"/>
<ellipse cx="560" cy="324" rx="131" ry="226" fill="url(#interior)" stroke="url(#portal)" stroke-width="10"/>
<g clip-path="url(#gate)">
 <path d="M390 148L519 267L478 392L581 482L555 595M712 95L616 240L655 332L582 407L721 518" fill="none" stroke="#b590ff" stroke-width="27" opacity=".19"/>
