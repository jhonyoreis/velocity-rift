 <path d="M113 589C211 583 269 603 328 579" stroke="#ffce8f" stroke-width="2" opacity=".65"/>
</g>
<!-- Flux: dynamic running pose in the game's yellow, teal, white and orange palette -->
<g transform="translate(345 493) rotate(-8)">
 <ellipse cx="17" cy="132" rx="153" ry="18" fill="#7ef9e8" opacity=".17" filter="url(#glow)"/>
 <!-- Rear leg -->
