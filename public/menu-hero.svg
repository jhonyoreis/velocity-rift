 <path d="M527 265L575 294L615 256L598 334L643 370L583 393L557 477L537 395L492 374L533 329Z" fill="#86f8ef" opacity=".25"/>
</g>
<ellipse cx="560" cy="324" rx="131" ry="226" fill="none" stroke="#e1edff" stroke-width="2" stroke-dasharray="4 14" opacity=".75"/>
<path d="M430 146L399 116L447 152M669 155L714 129L679 194M432 472L392 519L447 492M661 499L706 529L667 460" fill="none" stroke="#a7fdee" stroke-width="7" stroke-linecap="round" opacity=".8"/>
