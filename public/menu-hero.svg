<path d="M0 647C245 608 384 627 570 637C695 643 759 635 850 616V760H0Z" fill="#0a1533"/>
<path d="M0 665C280 620 455 654 850 628" fill="none" stroke="#78fce9" stroke-width="5" opacity=".7"/>
<path d="M0 704C345 641 558 693 850 676" fill="none" stroke="#7f76ca" stroke-width="2" opacity=".43"/>
<g fill="none" stroke="#7cfde8" stroke-width="7" stroke-linecap="round" opacity=".25" filter="url(#glow)">
 <path d="M72 537C167 518 199 552 304 530"/><path d="M65 573C150 558 246 567 332 563"/>
</g>
<g fill="none" stroke-linecap="round">
 <path d="M68 528C176 510 206 545 304 525" stroke="#76f4df" stroke-width="5" opacity=".68"/>
