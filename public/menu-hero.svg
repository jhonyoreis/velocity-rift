 <path d="M42-63L69-70L71-54L47-48Z" fill="#0f264e"/>
 <path d="M54-62l8-3" stroke="#efffff" stroke-width="4" stroke-linecap="round"/>
 <circle cx="96" cy="-37" r="7" fill="#163456"/>
 <!-- Forward arm and glove -->
 <path d="M36 35L94 18L130-5" fill="none" stroke="#33a4ae" stroke-width="23" stroke-linecap="round"/>
 <path d="M122-16l25-6 19 8-2 20-22 19-24-11z" fill="#f0ffff" stroke="#225e7c" stroke-width="5" stroke-linejoin="round"/>
 <!-- Momentum highlight -->
 <path d="M-42 3L-67 35L-48 52" fill="none" stroke="#a7fff0" stroke-width="5" stroke-linecap="round" opacity=".7"/>
</g>
<!-- Sparkles -->
<path d="M269 469v-21m-10 10h20M746 417v-18m-9 9h18M162 389v-11m-5 5h10" stroke="#baffef" stroke-width="2.2" stroke-linecap="round" opacity=".68"/>
