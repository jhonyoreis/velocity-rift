<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Velocity Rift 2.0</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="game-panel" aria-label="Velocity Rift 2.0">
        <canvas id="game" width="960" height="540"></canvas>
        <div id="overlay" class="overlay">
          <h1>Velocity Rift</h1>
          <p>Floresta Neon · Primeiro Impulso — Fase estendida</p>
          <button id="startButton" type="button">Jogar</button>
        </div>
        <div class="touch-controls" aria-label="Controles de toque">
          <button type="button" data-key="arrowleft" aria-label="Esquerda">◀</button>
          <button type="button" data-key="arrowright" aria-label="Direita">▶</button>
          <button type="button" data-key=" " aria-label="Pular">Pular</button>
          <button type="button" data-key="shift" aria-label="Boost">Boost</button>
          <button type="button" data-key="arrowdown" aria-label="Deslizar">Slide</button>
        </div>
      </section>

      <section class="notes" aria-label="Controls">
        <div>
          <strong>Move</strong>
          <span>A/D or arrows</span>
        </div>
        <div>
          <strong>Jump</strong>
          <span>Space, W or Up</span>
        </div>
        <div>
          <strong>Boost</strong>
          <span>Shift or J</span>
        </div>
        <div>
          <strong>Slide / Pausa</strong>
          <span>S / ↓ · P · R</span>
        </div>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
