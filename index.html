<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Velocity Rift 2.0</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="game-panel" aria-label="Velocity Rift 2.0">
        <canvas id="game" width="960" height="540"></canvas>
        <div id="overlay" class="overlay">
          <h1>Velocity Rift</h1>
          <p>Floresta Neon · Primeiro Impulso — Fase estendida</p>
          <button id="startButton" type="button">Jogar</button>
        </div>
        <div class="touch-controls" aria-label="Controles de toque">
          <button type="button" data-key="arrowleft" aria-label="Esquerda">◀</button>
          <button type="button" data-key="arrowright" aria-label="Direita">▶</button>
          <button type="button" data-key=" " aria-label="Pular">Pular</button>
          <button type="button" data-key="shift" aria-label="Boost">Boost</button>
          <button type="button" data-key="arrowdown" aria-label="Deslizar">Slide</button>
        </div>
      </section>

      <div class="game-toolbar">
        <div class="hero-identity">
          <strong>FLUX <span>// CORREDOR DA FENDA</span></strong>
          <small>Capacete de plasma · cachecol âmbar · energia cinética</small>
        </div>
        <button id="soundToggle" class="sound-toggle" type="button" aria-label="Ligar ou desligar efeitos sonoros" aria-pressed="true">🔊 Som ligado</button>
      </div>

      <section class="notes" aria-label="Controls">
        <div>
          <strong>Mover</strong>
          <span>A/D ou setas</span>
        </div>
        <div>
          <strong>Pular</strong>
          <span>Espaço, W ou ↑</span>
        </div>
        <div>
          <strong>Boost</strong>
          <span>Shift ou J</span>
        </div>
        <div>
          <strong>Slide / Pausa</strong>
          <span>S / ↓ · P · R · M som</span>
        </div>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
